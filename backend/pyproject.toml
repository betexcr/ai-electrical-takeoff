[project]
name = "takeoff"
version = "0.0.1"
description = "AI Electrical Takeoff backend (Milestone 1: PDF feasibility tooling)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pymupdf>=1.26",
    "opencv-python-headless>=4.10",
    "numpy>=2.0",
    "pydantic>=2.8",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "playwright==1.61.0",
    "pytest>=8.3",
    "pytest-playwright>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["takeoff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["e2e: browser end-to-end tests (Playwright + Chromium); deselect with -m 'not e2e'"]
